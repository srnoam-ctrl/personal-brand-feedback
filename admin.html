<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דשבורד מנהל — סיכום משוב מיתוג אישי (מאובטח)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 antialiased p-4 md:p-8">

  <!-- Password Protected Login Gate -->
  <div id="loginView" class="max-w-md mx-auto mt-16 bg-white border border-slate-200 rounded-3xl p-8 shadow-sm space-y-5">
    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
      🔐
    </div>
    <div>
      <h1 class="text-xl font-bold text-slate-900">כניסה מאובטחת לניהול</h1>
      <p class="text-xs text-slate-500 mt-1">רק אתה מורשה לצפות בתשובות. הנתונים מאובטחים בצד שרת.</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="adminKey" class="block text-xs font-semibold text-slate-700 mb-1">סיסמת ניהול (Admin Key):</label>
        <input type="password" id="adminKey" required placeholder="הזן סיסמה..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm focus:bg-white focus:outline-none focus:border-indigo-600" />
      </div>
      <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 transition">
        כניסה לצפייה בתשובות
      </button>
      <div id="loginError" class="hidden text-xs text-red-600 font-semibold text-center"></div>
    </form>
  </div>

  <!-- Authenticated Dashboard View (Hidden by default) -->
  <div id="dashboardView" class="hidden max-w-4xl mx-auto space-y-6">

    <!-- Header bar -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
      <div>
        <span class="inline-block px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">
          ● חיבור מאובטח
        </span>
        <h1 class="text-2xl font-black text-slate-900 mt-1">סיכום משוב מיתוג אישי</h1>
        <p class="text-xs text-slate-500">כל התשובות אנונימיות לחלוטין וללא פרטים מזהים</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="refreshBtn" class="text-xs px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 font-semibold transition">
          🔄 רענון נתונים
        </button>
        <button id="exportCsvBtn" class="text-xs px-3.5 py-2 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-semibold transition">
          📊 ייצוא ל-Excel / CSV
        </button>
        <button id="logoutBtn" class="text-xs px-3 py-2 rounded-xl text-slate-400 hover:text-slate-800 transition">
          התנתק
        </button>
      </div>
    </header>

    <!-- Metrics Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">סך כל המשיבים</div>
        <div class="text-2xl font-black text-slate-900 mt-1" id="totalCount">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">עמיתים (Peers)</div>
        <div class="text-2xl font-black text-indigo-600 mt-1" id="peerCount">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">מנהלים לשעבר</div>
        <div class="text-2xl font-black text-amber-600 mt-1" id="managerCount">0</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">עובדים בצוות שלי</div>
        <div class="text-2xl font-black text-emerald-600 mt-1" id="reportCount">0</div>
      </div>
    </div>

    <!-- Top Traits Cloud -->
    <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-3">
      <h2 class="text-base font-bold text-slate-900">תכונות בולטות (לפי תדירות בחירה)</h2>
      <div id="traitsFrequency" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Filter Buttons -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
      <span class="text-slate-400 font-semibold">סינון לפי קשר:</span>
      <button class="filter-btn px-3 py-1.5 rounded-xl border border-indigo-600 bg-indigo-600 text-white font-semibold" data-filter="all">הכל</button>
      <button class="filter-btn px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700" data-filter="peer">עמיתים</button>
      <button class="filter-btn px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700" data-filter="report">מנהלים לשעבר</button>
      <button class="filter-btn px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700" data-filter="manager">עובדים שניהלתי</button>
    </div>

    <!-- Responses List -->
    <div id="responsesContainer" class="space-y-4">
      <!-- Injected via JavaScript -->
    </div>

  </div>

  <script>
    // Sample mock data for demo preview if offline
    let allResponses = [
      {
        id: "1",
        createdAt: "2026-11-09 14:15",
        role: "report", // ניהל אותי
        traits: ["חשיבה אסטרטגית", "שקט נפשי בלחץ", "אחריות (Ownership)"],
        goTo: "היו צריכים מישהו שייקח משימה מורכבת שנתקעה בין צוותים ויביא אותה לביצוע חלק בלי מלחמות אגו.",
        diff: "יכולת נדירה לראות את התמונה הרחבה של הביזנס, יחד עם ירידה לפרטים הטכניים הכי קטנים כשצריך.",
        roleSpecific: "משימות שדורשות הובלה עצמאית תחת אי-ודאות. ידעתי שאפשר להפקיד את זה בידיך בעיניים עצומות.",
        story: "במשבר הרבעוני כשהיה פיגור בזמנים — שמרת על קור רוח, בנית סדר עדיפויות מחדש והחזרת את הביטחון לצוות.",
        improve: "לפעמים אתה לוקח על עצמך יותר מדי עומס במקום לדרוש מאחרים להשלים את החלק שלהם.",
        metaphor: "מגדלור בים סוער"
      },
      {
        id: "2",
        createdAt: "2026-11-09 14:40",
        role: "peer", // עמית
        traits: ["תקשורת בגובה העיניים", "חיבור בין אנשים", "פתרון בעיות יצירתי"],
        goTo: "היה צריך לגשר על פערים מקצועיים בין אנשים שונים ולמצוא פתרון פרקטי ומקובל על כולם.",
        diff: "משהו שיש לנו במשותף: תמיד מחפש את התכל'ס ולא מבזבז זמן על פוליטיקה ארגונית.",
        roleSpecific: "היית הגורם המאזן והמרגיע כשהיו חילוקי דעות סוערים בצוות.",
        story: "כשעבדנו יחד על האפיון החדש וישבנו עד שעה מאוחרת לפתור באג קריטי — האנרגיה החיובית שלך החזיקה את כולם.",
        improve: "לדאוג יותר לשווק את ההצלחות שלך להנהלה, לפעמים אתה עושה דברים ענקיים בשקט בלי שיראו מספיק.",
        metaphor: "קפטן ספינה שמכיר כל חלק במנוע"
      }
    ];

    let currentFilter = "all";

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const key = document.getElementById("adminKey").value;
      const btn = document.getElementById("loginBtn");
      btn.textContent = "בודק הרשאה...";

      try {
        const res = await fetch(`/api/admin?key=${encodeURIComponent(key)}`);
        if (res.ok) {
          const data = await res.json();
          allResponses = data.responses || allResponses;
          showDashboard();
        } else {
          // For local offline preview test (accept password 'admin123')
          if (key === "admin123" || key === "1234") {
            showDashboard();
          } else {
            showError("סיסמה שגויה. הגישה חסומה.");
          }
        }
      } catch (err) {
        if (key === "admin123" || key === "1234") {
          showDashboard();
        } else {
          showError("סיסמה שגויה.");
        }
      } finally {
        btn.textContent = "כניסה לצפייה בתשובות";
      }
    };

    function showError(msg) {
      const err = document.getElementById("loginError");
      err.textContent = msg;
      err.classList.remove("hidden");
    }

    function showDashboard() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      renderMetrics();
      renderTraitsFrequency();
      renderResponses();
    }

    function renderMetrics() {
      document.getElementById("totalCount").textContent = allResponses.length;
      document.getElementById("peerCount").textContent = allResponses.filter(r => r.role === "peer").length;
      document.getElementById("managerCount").textContent = allResponses.filter(r => r.role === "report").length;
      document.getElementById("reportCount").textContent = allResponses.filter(r => r.role === "manager").length;
    }

    function renderTraitsFrequency() {
      const counts = {};
      allResponses.forEach(r => {
        (r.traits || []).forEach(t => counts[t] = (counts[t] || 0) + 1);
      });

      const container = document.getElementById("traitsFrequency");
      container.innerHTML = "";
      Object.entries(counts).sort((a,b) => b[1] - a[1]).forEach(([trait, count]) => {
        const span = document.createElement("span");
        span.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-800";
        span.innerHTML = `<span>${trait}</span><span class="bg-indigo-600 text-white rounded-full px-1.5 py-0.2 text-[10px] font-bold">${count}</span>`;
        container.appendChild(span);
      });
    }

    const roleHebrew = {
      peer: { title: "🤝 עמית/ה (Peer)", badge: "bg-indigo-50 text-indigo-700 border-indigo-200" },
      report: { title: "🧭 מנהל/ת לשעבר (ניהל/ה אותי)", badge: "bg-amber-50 text-amber-700 border-amber-200" },
      manager: { title: "🎯 כפיף/ה לשעבר (הייתי מנהל)", badge: "bg-emerald-50 text-emerald-700 border-emerald-200" }
    };

    function renderResponses() {
      const container = document.getElementById("responsesContainer");
      container.innerHTML = "";

      const filtered = currentFilter === "all" ? allResponses : allResponses.filter(r => r.role === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white border border-slate-200 rounded-3xl p-8 text-center text-sm text-slate-400">אין עדיין מענים בקטגוריה זו.</div>`;
        return;
      }

      filtered.forEach((r, idx) => {
        const roleInfo = roleHebrew[r.role] || { title: "אנונימי", badge: "bg-slate-100 text-slate-700 border-slate-200" };
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4";
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full border text-xs font-bold ${roleInfo.badge}">${roleInfo.title}</span>
              <span class="text-xs text-slate-400">תשובה #${idx + 1}</span>
            </div>
            <span class="text-xs text-slate-400">${r.createdAt || "היום"}</span>
          </div>

          <!-- Traits -->
          ${r.traits && r.traits.length ? `
            <div>
              <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">תכונות שנבחרו:</div>
              <div class="flex flex-wrap gap-1.5">
                ${r.traits.map(t => `<span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 text-indigo-800 text-xs font-semibold">${t}</span>`).join("")}
              </div>
            </div>
          ` : ""}

          <!-- Go-To -->
          ${r.goTo ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-slate-900">⚡ פנו אליי כש...</div>
              <p class="text-sm text-slate-700 bg-slate-50 p-3 rounded-2xl border border-slate-100 leading-relaxed">${r.goTo}</p>
            </div>
          ` : ""}

          <!-- Differentiator -->
          ${r.diff ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-slate-900">💎 מה שאני עושה אחרת / טוב יותר:</div>
              <p class="text-sm text-slate-700 bg-slate-50 p-3 rounded-2xl border border-slate-100 leading-relaxed">${r.diff}</p>
            </div>
          ` : ""}

          <!-- Role specific -->
          ${r.roleSpecific ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-indigo-700">🎯 מענה מותאם תפקיד:</div>
              <p class="text-sm text-slate-700 bg-indigo-50/40 p-3 rounded-2xl border border-indigo-100 leading-relaxed">${r.roleSpecific}</p>
            </div>
          ` : ""}

          <!-- Story -->
          ${r.story ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-slate-900">📖 סיפור או רגע זכור:</div>
              <p class="text-sm text-slate-700 bg-slate-50 p-3 rounded-2xl border border-slate-100 leading-relaxed">${r.story}</p>
            </div>
          ` : ""}

          <!-- Growth / Improvement -->
          ${r.improve ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-amber-800">🌱 נקודה לשיפור / השלב הבא:</div>
              <p class="text-sm text-slate-700 bg-amber-50/50 p-3 rounded-2xl border border-amber-200/60 leading-relaxed">${r.improve}</p>
            </div>
          ` : ""}

          <!-- Metaphor -->
          ${r.metaphor ? `
            <div class="space-y-1">
              <div class="text-xs font-bold text-purple-800">🎨 דימוי / תמונת פרופיל מטאפורית:</div>
              <p class="text-sm text-slate-700 bg-purple-50/50 p-3 rounded-2xl border border-purple-100 leading-relaxed">${r.metaphor}</p>
            </div>
          ` : ""}
        `;
        container.appendChild(card);
      });
    }

    // Filter clicks
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.className = "filter-btn px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-slate-700";
        });
        btn.className = "filter-btn px-3 py-1.5 rounded-xl border border-indigo-600 bg-indigo-600 text-white font-semibold";
        currentFilter = btn.getAttribute("data-filter");
        renderResponses();
      };
    });

    document.getElementById("logoutBtn").onclick = () => location.reload();

    // Export CSV
    document.getElementById("exportCsvBtn").onclick = () => {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "ID,Role,Traits,GoTo,Differentiator,RoleSpecific,Story,Improvement,Metaphor\n";
      allResponses.forEach(r => {
        const clean = str => `"${(str || '').replace(/"/g, '""')}"`;
        csvContent += [
          r.id,
          r.role,
          clean((r.traits || []).join(", ")),
          clean(r.goTo),
          clean(r.diff),
          clean(r.roleSpecific),
          clean(r.story),
          clean(r.improve),
          clean(r.metaphor)
        ].join(",") + "\n";
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `personal_brand_feedback_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  </script>
</body>
</html>
